<html>

    {% include head.html %}

    <body>

        {% include header.html %}

        <section id="banner" class="style4">
            <video class="banner-video" autoplay muted loop playsinline poster="{{ site.baseurl }}/{{ page.image }}">
                <source src="{{ site.baseurl }}/assets/videos/banner_bacillus.mp4" type="video/mp4">
            </video>
            <div class="inner">
                <header class="major">

                    <h1>{{ page.title }}</h1>

                </header>
                <div class="content">

                    {{ page.description }}

                </div>
            </div>
        </section>

    {{ content }}

    {% include footer.html %}

</body>

</html>
